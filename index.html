<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mockup</title>
</head>

<body>
    <div class="content" style="
        display: flex;
        flex-direction: row;
        ">
        <div class="prematch">
            Pre-Match Info <br>
            <input type="text" placeholder="Scouter" class="scouter"> <br>
            <input type="text" placeholder="Alliance" class="alliance"> <br>
            <input type="text" placeholder="Station" class="station"> <br>
            <input type="text" placeholder="Team" class="team"> <br>
            <input type="text" placeholder="Match Number" class="match"> <br>
        </div>
<div class="Auto">
            Auto <br>
            <input type="number" placeholder="Fuel Scored" class="scored"> <br>
            <input type="number" placeholder="Fuel Pushed" class="pushed"> <br>
            <input type="number" placeholder="Fuel Passed" class="passed"> <br>
            <input type="checkbox" class="defense"> Played Defense<br>
            <input type="checkbox" class="penalty"> Had Penaltys<br>
        </div>
        <div class="Tele">
            Tele <br>
            <input type="number" placeholder="Fuel Scored" class="scored"> <br>
            <input type="number" placeholder="Fuel Pushed" class="pushed"> <br>
            <input type="number" placeholder="Fuel Passed" class="passed"> <br>
            <input type="checkbox" class="defense"> Played Defense<br>
            <input type="checkbox" class="penalty"> Had Penaltys<br>
        </div>
    </div>
    <button class="submit">Submit</button>
</body>

</html>
